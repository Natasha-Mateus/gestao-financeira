<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1 class="display">Gestão Financeira</h1>
    <p class="subtitle">Controle do casal</p>
    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" required>
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" required>
      <button type="submit" class="btn" style="width:100%">Entrar</button>
      <p id="login-error" style="color:#B5654A; font-size:13px; margin-top:12px; display:none;"></p>
    </form>
  </div>
</div>

<div id="app-shell">
  <nav class="sidebar">
    <div class="brand">
      <div class="display">Gestão Financeira</div>
      <span>Casal</span>
    </div>
    <div class="nav-item active" data-module="dashboard">Dashboard</div>
    <div class="nav-item" data-module="contasFixas">Contas Fixas</div>
    <div class="nav-item" data-module="mercado">Mercado</div>
    <div class="nav-item" data-module="cartao">Cartão de Crédito</div>
    <div class="nav-item" data-module="renda">Renda e Reservas</div>
    <div class="nav-footer">
      <button id="logout-btn">Sair</button>
    </div>
  </nav>
  <main class="main-content" id="main-content">
    <!-- Conteúdo do módulo é injetado aqui -->
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
