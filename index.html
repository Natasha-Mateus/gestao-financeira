<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Financeira</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1 class="display">Gestão Financeira</h1>
    <p class="subtitle">Controle do casal</p>
    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" required>
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" required>
      <button type="submit" class="btn" style="width:100%">Entrar</button>
      <p id="login-error" style="color:#B5654A; font-size:13px; margin-top:12px; display:none;"></p>
    </form>
  </div>
</div>

<div id="app-shell">
  <div class="mobile-topbar">
    <button id="mobile-menu-btn" aria-label="Abrir menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="mobile-topbar-title">Gestão Financeira</span>
  </div>
  <div id="sidebar-overlay"></div>
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <div class="display brand-text">Gestão Financeira</div>
      <span class="brand-text">Casal</span>
      <button id="collapse-btn" title="Recolher/expandir menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="nav-item active" data-route="dashboard">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="nav-text">Dashboard</span>
    </div>

    <div class="nav-item" data-route="renda">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 5c-1.5-1.5-4-2-6-2-4 0-8 2.5-8 7s4 7 8 7c1 0 2-.1 3-.4"/><path d="M14 10a2 2 0 100 4"/><path d="M19 9v6l2-2M19 9l2 2"/></svg>
      <span class="nav-text">Receitas</span>
    </div>

    <div class="nav-item" data-route="contasFixas">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16l-3-2-3 2-3-2-3 2-3-2-1 2z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
      <span class="nav-text">Contas Fixas</span>
    </div>

    <div class="nav-item" data-route="variaveis">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
      <span class="nav-text">Variáveis</span>
    </div>

    <div class="nav-item nav-parent" data-parent="mercado">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      <span class="nav-text">Mercado</span>
      <svg class="nav-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="nav-submenu" id="submenu-mercado">
      <div class="nav-subitem active" data-route="mercado.compra"><span class="nav-text">Compra</span></div>
      <div class="nav-subitem" data-route="mercado.despensa"><span class="nav-text">Despensa</span></div>
      <div class="nav-subitem" data-route="mercado.lista"><span class="nav-text">Lista de compras</span></div>
    </div>

    <div class="nav-item nav-parent" data-parent="cartao">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <span class="nav-text">Cartão de Crédito</span>
      <svg class="nav-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="nav-submenu" id="submenu-cartao">
      <div class="nav-subitem active" data-route="cartao.cartoes"><span class="nav-text">Cartões</span></div>
      <div class="nav-subitem" data-route="cartao.vale"><span class="nav-text">Vale Alimentação</span></div>
      <div class="nav-subitem" data-route="cartao.lancamentos"><span class="nav-text">Lançamentos</span></div>
      <div class="nav-subitem" data-route="cartao.faturas"><span class="nav-text">Faturas futuras</span></div>
    </div>

    <div class="nav-item" data-route="historico">
      <svg class="nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>
      <span class="nav-text">Histórico</span>
    </div>

    <div class="nav-footer">
      <button id="logout-btn">Sair</button>
    </div>
  </nav>
  <main class="main-content" id="main-content">
    <!-- Conteúdo do módulo é injetado aqui -->
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
